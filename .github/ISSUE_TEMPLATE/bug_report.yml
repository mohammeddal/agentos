name: Bug report
description: Report a reproducible problem with AgentOS.
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, private paths, or conversation data. Report security issues privately using SECURITY.md."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: AgentOS commit, macOS/browser version, and provider CLI version if relevant.
    validations:
      required: true
