[package]
name = "staffforge"
version = "0.1.0"
description = "Local-first AI Engineering Operating System"
authors = ["StaffForge"]
edition = "2021"

[lib]
name = "staffforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
serde_yaml = "0.9"
regex = "1"
libc = "0.2"
tauri-plugin-notification = "2"
base64 = "0.22"
pdf-extract = "0.12"
